version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: saferoute-postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saferoute
    ports:
      - "5432:5432"
    volumes:
      - saferoute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saferoute"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: saferoute-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/saferoute
      SECRET_KEY: saferoute-hackathon-24h-super-secret-key-2026
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  saferoute_pgdata:
