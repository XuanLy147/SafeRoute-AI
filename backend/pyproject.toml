[project]
name = "saferoute-ai-backend"
version = "1.0.0"
description = "SafeRoute AI - FastAPI Backend with PostgreSQL/PostGIS & YOLOv12s"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.33.0",
    "pydantic>=2.6.0,<2.11.0",
    "pydantic-settings>=2.2.0,<2.8.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "geoalchemy2>=0.14.4,<0.18.0",
    "psycopg2-binary>=2.9.9,<2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "shapely>=2.0.3",
    "alembic>=1.13.1",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations", "app/modules/risk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["B008", "BLE001", "E501", "UP042", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
