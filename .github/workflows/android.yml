name: Android integration
on:
  push:
    branches: [main, integration/saferoute-full-release]
  pull_request:
    branches: [main, integration/saferoute-full-release]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM, Robolectric, APK, instrumentation APK and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device regression (does not claim live provider E2E)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.comeforfood.saferoute.Tv1DeviceTest,com.comeforfood.saferoute.Tv2DeviceTest,com.comeforfood.saferoute.HtmlFlowDeviceTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
